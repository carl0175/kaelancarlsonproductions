    <title>Digital Art | Kaelan Carlson Productions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="digital-art-page">
    <header class="site-header" data-header>
      <a class="brand" href="index.html" aria-label="Kaelan Carlson Productions home">
        <img src="assets/KCP.png" alt="Kaelan Carlson Productions" />
      </a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-button>
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" id="site-nav" data-nav>

        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>

    <main>
      <section class="page-hero" aria-labelledby="digital-art-title">
        <p class="kicker">05 / Digital Art</p>
        <h1 id="digital-art-title">Digital art, Logos.</h1>
      </section>

      <section class="page-content" aria-label="Digital art gallery">
        <div class="art-grid" data-art-gallery>
          <article>
            <a href="assets/digital-art/large/alien-coachella.webp" aria-label="Open Alien Coachella digital illustration">
              <img src="assets/digital-art/thumbs/alien-coachella.webp" alt="Alien Coachella digital illustration" loading="eager" decoding="async" fetchpriority="high" />
            </a>
          </article>
          <article>
            <a href="assets/digital-art/large/kpc.webp" aria-label="Open KPC graphic">
              <img src="assets/digital-art/thumbs/kpc.webp" alt="KPC graphic" loading="eager" decoding="async" fetchpriority="high" />
            </a>
          </article>
          <article>
            <a href="assets/digital-art/large/itunes-copy.webp" aria-label="Open iTunes-inspired digital artwork">
              <img src="assets/digital-art/thumbs/itunes-copy.webp" alt="iTunes-inspired digital artwork" loading="lazy" decoding="async" />
            </a>
          </article>
          <article>
            <a href="assets/digital-art/large/off-cut-studios.webp" aria-label="Open Off Cut Studios logo">
              <img src="assets/digital-art/thumbs/off-cut-studios.webp" alt="Off Cut Studios logo" loading="lazy" decoding="async" />
            </a>
          </article>
          <article>
            <a href="assets/digital-art/large/cohort-creative.webp" aria-label="Open Cohort Creative logo">
              <img src="assets/digital-art/thumbs/cohort-creative.webp" alt="Cohort Creative logo" loading="lazy" decoding="async" />
            </a>
          </article>
          <article>
            <a href="assets/digital-art/large/untitled-3.webp" aria-label="Open untitled digital artwork">
              <img src="assets/digital-art/thumbs/untitled-3.webp" alt="Untitled digital artwork" loading="lazy" decoding="async" />
            </a>
          </article>
          <article>
            <a href="assets/digital-art/large/kcp-wordmark.webp" aria-label="Open Kaelan Carlson Productions wordmark">
              <img src="assets/digital-art/thumbs/kcp-wordmark.webp" alt="Kaelan Carlson Productions wordmark" loading="lazy" decoding="async" />
            </a>
          </article>
          <article>
            <a href="assets/digital-art/large/kcp-lighthouse.webp" aria-label="Open Kaelan Carlson Productions lighthouse logo">
              <img src="assets/digital-art/thumbs/kcp-lighthouse.webp" alt="Kaelan Carlson Productions lighthouse logo" loading="lazy" decoding="async" />
            </a>
          </article>
        </div>

    <footer>
      <span>Kaelan Carlson Productions</span>
